name: Type Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ty:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt ty

      - name: Run ty
        run: ty check --output-format github
