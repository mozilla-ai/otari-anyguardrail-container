name: package-encoderfiles

# Currently retrieves the main version of encoderfiles in
# the huggingface repo. This should be parameterized somehow 
on:
  workflow_dispatch:
env:
  ENCODERFILE_VERSION: v0.6.2
  ENCODERFILE_BRANCH: main

jobs:
  setup:
    name: Checkout code and set encoderfile version matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.setup_matrix.outputs.matrix }}
    steps:
      - id: checkout
        name: Checkout code
        uses: actions/checkout@v4

      - id: setup_matrix
        name: Set up encoderfile matrix
        run: |
          # Extract the encoderfile matrix config from the manifest and set it as a job output.
          MATRIX_CONFIG=$(yq -o=json -I=0 '.' encoderfile-manifest.yaml)
          echo "matrix=${MATRIX_CONFIG}" >> $GITHUB_OUTPUT

  build-and-push:
    needs: setup
    name: Build and push encoderfile containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in (and push) on push events. PRs from forks can't access
      # secrets anyway; PRs from same-repo branches still skip the push so
      # that "PR open" doesn't publish branch images.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retrieve and prepare encoderfile containers
        id: encoderfile
        run: |
          set +e
          export ENCODERFILE_NAME=${{ matrix.encoderfile.model }}.${{ matrix.cpu_arch_spec.spec }}-${{ matrix.os_spec }}
          curl -L -o ${ENCODERFILE_NAME}.encoderfile ${{ matrix.encoderfile.location }}/${{ matrix.encoderfile.branch }}/${ENCODERFILE_NAME}.encoderfile?download=true
          export IMAGE_NAME=$(echo mzdotai/${ENCODERFILE_NAME}-encoderfile | tr '[:upper:]' '[:lower:]')
          envsubst < encoderfile.dockerfile.template > encoderfile.dockerfile
          # for debugging purposes
          cat encoderfile.dockerfile
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.encoderfile.outputs.image_name }}
          tags: |
            # On every push to main: tag :latest and the short SHA.
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            # On git tag v1.2.3: also tag :1.2.3, :1.2, :1.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # PR builds get a :pr-<n> tag for debugging if push were enabled.
            type=ref,event=pr
            # All branch builds get a :<branch> tag for debugging if push were enabled.
            type=ref,event=branch

      - name: Build and push encoderfile container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: encoderfile.dockerfile
          platforms: ${{ matrix.cpu_arch_spec.img }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ env.ENCODERFILE_VERSION }}




