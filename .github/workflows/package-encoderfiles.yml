name: package-encoderfiles

# Currently retrieves the main version of encoderfiles in
# the huggingface repo. This should be parameterized somehow 
on:
  workflow_dispatch:
env:
  ENCODERFILE_VERSION: v0.6.2
  ENCODERFILE_BRANCH: main

jobs:
  build-and-push:
    name: docker build (+ push on main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      matrix:
        ENCODERFILE_NAME: [{model: "DuoGuard-0.5B", location: "https://huggingface.co/mozilla-ai/DuoGuard-DuoGuard-0.5B-encoderfile/resolve"}, {model: "PIGuard", location: "https://huggingface.co/mozilla-ai/leolee99-PIGuard-encoderfile/resolve"}]
        CPU_ARCH_SPEC: [{spec: "x86_64", img: "linux/amd64"}, {spec: "aarch64", img: "linux/arm64"}]
        OS_SPEC: ["unknown-linux-gnu"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in (and push) on push events. PRs from forks can't access
      # secrets anyway; PRs from same-repo branches still skip the push so
      # that "PR open" doesn't publish branch images.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retrieve and prepare encoderfile containers
        id: encoderfile
        run: |
          export ENCODERFILE_NAME=${{ matrix.ENCODERFILE_NAME.model }}.${{ matrix.CPU_ARCH_SPEC.spec }}-${{ matrix.OS_SPEC }}
          curl -L -o ${ENCODERFILE_NAME}.encoderfile ${{ matrix.ENCODERFILE_NAME.location }}/${{ env.ENCODERFILE_BRANCH }}/${ENCODERFILE_NAME}.encoderfile?download=true
          export IMAGE_NAME=$(echo mzdotai/${ENCODERFILE_NAME}-encoderfile | tr '[:upper:]' '[:lower:]')
          envsubst < encoderfile.dockerfile.template > encoderfile.dockerfile
          # for debugging purposes
          cat encoderfile.dockerfile
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.encoderfile.outputs.image_name }}
          tags: |
            # Keep the configured encoderfile version tag for release compatibility.
            type=raw,value=${{ env.ENCODERFILE_VERSION }}
            # On every push to main: tag :latest and the short SHA.
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            # On git tag v1.2.3: also tag :1.2.3, :1.2, :1.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # PR builds get a :pr-<n> tag for debugging if push were enabled.
            type=ref,event=pr

      - name: Build and push encoderfile container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: encoderfile.dockerfile
          platforms: ${{ matrix.CPU_ARCH_SPEC.img }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ env.ENCODERFILE_VERSION }}




