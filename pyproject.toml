[project]
name = "otari-anyguardrails-container"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "any-guardrail[all]==0.5.1",
    "fastapi==0.136.3",
    "pyyaml==6.0.3",
    "uvicorn==0.48.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ty"
]

[tool.uv]
package = false
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["src"]
